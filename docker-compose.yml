services:

  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: <YOUR_PASSWORD_HERE>
    volumes:
      - ./db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mariadb-admin" ,"ping", "-h", "localhost", "--password=<YOUR_PASSWORD_HERE>" ]

  adminer:
    image: adminer
    restart: always
    ports:
      - "7070:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: inpoll-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: inpoll-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
