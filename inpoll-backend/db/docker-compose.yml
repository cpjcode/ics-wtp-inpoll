services:
  db:
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: <YOUR_PASSWORD_HERE>
    volumes:
      - ./db-data:/var/lib/mysql
    ports:
      - 3306:3306
  adminer:
    image: adminer
    restart: always
    ports:
      - 7070:8080
    depends_on:
      - db
